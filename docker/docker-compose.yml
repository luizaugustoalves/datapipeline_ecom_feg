version: '3.8'

services:
  postgres:
    image: postgres:11.4
    container_name: airflow_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: airflow_adminer
    ports:
      - "9090:8080"
    depends_on:
      - postgres

  airflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airflow_webserver
    environment:
      - AIRFLOW_HOME=/home/airflow/gcs
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=True
      - AIRFLOW__WEBSERVER__RBAC=True
      - AIRFLOW_ENV=development
      - GOOGLE_APPLICATION_CREDENTIALS=/home/airflow/gcp/service-account.json
    ports:
      - "8080:8080"
    volumes:
      - ../dags:/home/airflow/gcs/dags
      - ./service-account.json:/home/airflow/gcp/service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
